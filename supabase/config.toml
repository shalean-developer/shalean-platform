# Shalean Platform — Supabase local config (Edge Functions + migrations).
# See docs/backend-migration-architecture.md
# Active migrations: supabase/migrations (14-digit filenames only).
# Archive (ignored by CLI): supabase/migrations-legacy
# Governance: docs/database-baseline/migration-governance.md · npm run db:migrations:validate

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Per-function only — top-level [functions] verify_jwt = bool breaks Preview parse
# ("functions[verify_jwt] expected a map or struct, got bool").
[functions.whatsapp-worker]
verify_jwt = false
