name: Priority 4 lock refresh

on:
  push:
    branches:
      - feat/admin-rbac-priority4-workforce-my-work-clean

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-rbac-priority4-workforce-my-work-clean
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh only the npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore: refresh lockfile for nanoid security fix"
          git push origin HEAD:feat/admin-rbac-priority4-workforce-my-work-clean
