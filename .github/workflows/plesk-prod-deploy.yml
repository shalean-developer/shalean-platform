name: Plesk production deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact integration/shalean-release SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to confirm
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: plesk-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      short: ${{ steps.release.outputs.short }}
      artifact_id: ${{ steps.artifact.outputs.id }}
    steps:
      - name: Validate exact release head
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DEPLOY || { echo "::error::Type DEPLOY to continue."; exit 1; }
          FULL="$(gh api "repos/$REPO/commits/$REQUESTED" --jq .sha)"
          HEAD="$(gh api "repos/$REPO/git/ref/heads/integration/shalean-release" --jq .object.sha)"
          test "$FULL" = "$HEAD" || { echo "::error::Release is not current integration head."; exit 1; }
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=${FULL:0:8}" >> "$GITHUB_OUTPUT"

      - name: Find exact successful artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          NAME="plesk-prod-$SHA"
          ID="$(gh api "repos/$REPO/actions/artifacts?name=$NAME&per_page=100" --jq             '.artifacts | map(select(.expired == false and .workflow_run.head_sha == env.SHA)) | sort_by(.created_at) | last | .id // empty')"
          test -n "$ID" || { echo "::error::No unexpired artifact for exact SHA $SHA"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shalean.co.za
    steps:
      - name: Download and verify artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          unzip -q artifact.zip -d downloaded
          mv "downloaded/plesk-prod-$SHA.tar.gz" release.tar.gz
          tar -tzf release.tar.gz | grep -q 'build-meta.json'
          tar -tzf release.tar.gz | grep -q 'runtime/apps/web/server.js'
          tar -tzf release.tar.gz | grep -q 'runtime/apps/web/public/'

      - name: Configure SSH
        env:
          KEY: ${{ secrets.PLESK_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.PLESK_SSH_HOST }}
          PORT: ${{ secrets.PLESK_SSH_PORT }}
          USER: ${{ secrets.PLESK_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$HOST" && test -n "$USER"
          PORT="${PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/plesk && chmod 600 ~/.ssh/plesk
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.PLESK_SSH_HOST }}
          PORT: ${{ secrets.PLESK_SSH_PORT }}
          USER: ${{ secrets.PLESK_SSH_USER }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          scp -P "$PORT" -i ~/.ssh/plesk release.tar.gz "$USER@$HOST:.deploy-$SHA.tar.gz"

      - name: Extract and activate immutable release
        env:
          HOST: ${{ secrets.PLESK_SSH_HOST }}
          PORT: ${{ secrets.PLESK_SSH_PORT }}
          USER: ${{ secrets.PLESK_SSH_USER }}
          SHA: ${{ needs.validate.outputs.sha }}
          SHORT: ${{ needs.validate.outputs.short }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/plesk "$USER@$HOST"             "SHA='$SHA' SHORT='$SHORT' bash -s" <<'REMOTE'
          set -euo pipefail
          RELEASE="plesk-prod-$SHORT"
          ARCHIVE=".deploy-$SHA.tar.gz"
          PREVIOUS=""
          [ ! -L current ] || PREVIOUS="$(readlink current)"

          if [ ! -d "$RELEASE" ]; then
            mkdir "$RELEASE"
            tar -xzf "$ARCHIVE" -C "$RELEASE"
          fi
          rm -f "$ARCHIVE"

          test -f "$RELEASE/build-meta.json"
          test -f "$RELEASE/runtime/apps/web/server.js"
          test -d "$RELEASE/runtime/apps/web/.next"
          test -d "$RELEASE/runtime/apps/web/public"
          META="$(node -e "console.log(require('./$RELEASE/build-meta.json').artifact_sha)")"
          test "$META" = "$SHA"

          ln -sfn "$RELEASE" current.next
          mv -Tf current.next current
          printf '%s\n' "$PREVIOUS" > .shalean-previous-release
          printf '%s\n' "$RELEASE" > .shalean-current-release
          touch tmp/restart.txt
          echo "Activated $RELEASE; previous=${PREVIOUS:-none}"
          REMOTE

      - name: Verify production health
        id: health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            BODY="$(curl -fsS --max-time 10 https://shalean.co.za/api/health || true)"
            if jq -e '.status == "ok" and .service == "shalean-api"' >/dev/null 2>&1 <<<"$BODY"; then
              echo "$BODY"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Roll back on failed health
        if: failure() && steps.health.outcome == 'failure'
        env:
          HOST: ${{ secrets.PLESK_SSH_HOST }}
          PORT: ${{ secrets.PLESK_SSH_PORT }}
          USER: ${{ secrets.PLESK_SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/plesk "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PREVIOUS="$(cat .shalean-previous-release 2>/dev/null || true)"
          test -n "$PREVIOUS"
          test -d "$PREVIOUS/runtime/apps/web"
          ln -sfn "$PREVIOUS" current.next
          mv -Tf current.next current
          printf '%s\n' "$PREVIOUS" > .shalean-current-release
          touch tmp/restart.txt
          echo "Rolled back to $PREVIOUS"
          REMOTE
