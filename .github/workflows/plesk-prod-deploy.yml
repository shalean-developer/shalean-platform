name: Plesk production deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact integration/shalean-release SHA to prepare for Plesk pull
        required: true
        type: string
      confirmation:
        description: Type PREPARE to confirm
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: plesk-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      short: ${{ steps.release.outputs.short }}
      artifact_id: ${{ steps.artifact.outputs.id }}
    steps:
      - name: Validate exact release head
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.release_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PREPARE || { echo "::error::Type PREPARE to continue."; exit 1; }
          FULL="$(gh api "repos/$REPO/commits/$REQUESTED" --jq .sha)"
          HEAD="$(gh api "repos/$REPO/git/ref/heads/integration/shalean-release" --jq .object.sha)"
          test "$FULL" = "$HEAD" || { echo "::error::Release is not current integration head."; exit 1; }
          echo "sha=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=${FULL:0:8}" >> "$GITHUB_OUTPUT"

      - name: Find exact successful artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          NAME="plesk-prod-$SHA"
          ID="$(gh api "repos/$REPO/actions/artifacts?name=$NAME&per_page=100" --jq \
            '.artifacts | map(select(.expired == false and .workflow_run.head_sha == env.SHA)) | sort_by(.created_at) | last | .id // empty')"
          test -n "$ID" || { echo "::error::No unexpired artifact for exact SHA $SHA"; exit 1; }
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  stage:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shalean.co.za
    steps:
      - name: Download and verify exact artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact_id }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          unzip -q artifact.zip -d downloaded
          mv "downloaded/plesk-prod-$SHA.tar.gz" release.tar.gz
          tar -tzf release.tar.gz > archive-contents.txt
          grep -q 'build-meta.json' archive-contents.txt
          grep -q 'runtime/apps/web/server.js' archive-contents.txt
          grep -q 'runtime/apps/web/public/' archive-contents.txt
          tar -xOf release.tar.gz ./build-meta.json > build-meta.json
          META_SHA="$(jq -r .artifact_sha build-meta.json)"
          test "$META_SHA" = "$SHA"
          sha256sum release.tar.gz | tee release.tar.gz.sha256

      - name: Upload immutable artifact to private Supabase Storage
        env:
          SHA: ${{ needs.validate.outputs.sha }}
          SUPABASE_URL: ${{ secrets.PLESK_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLESK_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ vars.PLESK_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BUCKET"
          OBJECT="plesk-prod-$SHA.tar.gz"
          HTTP="$(curl -sS -o upload-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$OBJECT" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: false" \
            --data-binary @release.tar.gz)"
          test "$HTTP" = 200 || test "$HTTP" = 201 || {
            cat upload-response.json
            echo "::error::Private release upload failed with HTTP $HTTP"
            exit 1
          }

      - name: Create short-lived signed pull URL
        id: signed
        env:
          SHA: ${{ needs.validate.outputs.sha }}
          SUPABASE_URL: ${{ secrets.PLESK_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLESK_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ vars.PLESK_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          OBJECT="plesk-prod-$SHA.tar.gz"
          RESPONSE="$(curl -fsS \
            -X POST "$SUPABASE_URL/storage/v1/object/sign/$BUCKET/$OBJECT" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"expiresIn":3600}')"
          SIGNED="$(jq -r '.signedURL // .signedUrl // empty' <<<"$RESPONSE")"
          test -n "$SIGNED"
          case "$SIGNED" in
            http://*|https://*) URL="$SIGNED" ;;
            *) URL="${SUPABASE_URL%/}/storage/v1$SIGNED" ;;
          esac
          echo "::add-mask::$URL"
          printf '%s' "$URL" > plesk-pull-url.txt

      - name: Publish guarded pull bundle
        uses: actions/upload-artifact@v4
        with:
          name: plesk-pull-${{ needs.validate.outputs.sha }}
          path: |
            plesk-pull-url.txt
            release.tar.gz.sha256
            build-meta.json
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        env:
          SHA: ${{ needs.validate.outputs.sha }}
          SHORT: ${{ needs.validate.outputs.short }}
        run: |
          {
            echo "## PLESK-PULL-01 staged"
            echo
            echo "- Exact release SHA: `$SHA`"
            echo "- Immutable target: `plesk-prod-$SHORT`"
            echo "- Artifact uploaded to private release storage."
            echo "- Signed pull URL expires after one hour."
            echo "- Production activation is intentionally not performed by this stage."
          } >> "$GITHUB_STEP_SUMMARY"
