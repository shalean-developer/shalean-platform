name: Admin RBAC Priority 4

on:
  pull_request:
    paths:
      - "apps/web/lib/admin/**"
      - "apps/web/lib/security/**"
      - "apps/web/app/api/admin/**"
      - "apps/web/src/features/office/**"
      - "supabase/migrations/**"
      - "docs/admin-rbac-priority4-uat.md"
      - ".github/workflows/admin-rbac-priority4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-4-eight-role-dod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts
      - name: Run eight-role Definition of Done tests
        working-directory: apps/web
        run: >-
          npx vitest run
          lib/admin/__tests__/priority4EightRoleDod.test.ts
          lib/admin/__tests__/officeExperience.test.ts
          lib/admin/__tests__/officeAccessPolicyCoverage.test.ts
          lib/admin/__tests__/officeWorkItems.test.ts
          lib/admin/__tests__/routePermissions.test.ts
          lib/security/__tests__/p0CleanerColumnRbacContract.test.ts
          lib/security/__tests__/p0SupervisorCustomerScopeContract.test.ts
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
