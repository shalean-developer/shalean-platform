name: Plesk release standalone artifact

on:
  push:
    branches:
      - test/plesk-release-uat
    paths:
      - ".github/workflows/plesk-release-artifact.yml"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plesk-release-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release standalone Next.js runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard isolated Plesk release UAT branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "test/plesk-release-uat"
          git merge-base --is-ancestor f5dd54548ac4b1c50c7ce0cde744b05c4d8913e9 HEAD
          echo "Release UAT base f5dd54548ac4b1c50c7ce0cde744b05c4d8913e9"
          echo "Building commit ${GITHUB_SHA}"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @tailwindcss/postcss@^4
          node -e "require.resolve('@tailwindcss/postcss')"
          test -f node_modules/@shalean/utils/package.json
          test -d ../../packages/utils/src

      - name: Validate governed blog routes
        working-directory: apps/web
        run: npm run validate:blog-routes

      - name: Verify payment ownership regression
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://jhubpsbwmjgydkzztxeu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_IlDDZwioRpJRr2F6-B8WFA_uBrbZnkT"
          SHALEAN_APP_ENV: "preview"
          SHALEAN_ENFORCE_ENV_SAFETY: "true"
          OUTBOUND_MESSAGING_DISABLED: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx vitest run lib/booking/__tests__/ensureBookingPaymentSession.test.ts

      - name: Build production standalone output
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: "https://plesk-test.shalean.co.za"
          NEXT_PUBLIC_APP_URL: "https://plesk-test.shalean.co.za"
          SHALEAN_APP_ENV: "preview"
          SHALEAN_ENFORCE_ENV_SAFETY: "true"
          OUTBOUND_MESSAGING_DISABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://jhubpsbwmjgydkzztxeu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_IlDDZwioRpJRr2F6-B8WFA_uBrbZnkT"
          FACEBOOK_APP_ID: "ci-test-app-id"
          FACEBOOK_APP_SECRET: "ci-meta-data-deletion-test-secret"
        run: |
          set -euo pipefail
          node --max-old-space-size=8192 ./node_modules/next/dist/bin/next build --webpack
          test -f .next/BUILD_ID
          test -d .next/standalone
          test -f .next/standalone/apps/web/server.js

      - name: Add public and static assets to standalone runtime
        working-directory: apps/web
        run: |
          set -euo pipefail
          RUNTIME=".next/standalone/apps/web"
          test -f "$RUNTIME/server.js"

          rm -rf "$RUNTIME/public" "$RUNTIME/.next/static"
          mkdir -p "$RUNTIME/.next"
          cp -a public "$RUNTIME/public"
          cp -a .next/static "$RUNTIME/.next/static"

          test -d "$RUNTIME/public"
          test -d "$RUNTIME/.next/static"

      - name: Verify standalone server starts
        working-directory: apps/web/.next/standalone/apps/web
        env:
          HOSTNAME: "127.0.0.1"
          PORT: "3000"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: "https://plesk-test.shalean.co.za"
          NEXT_PUBLIC_APP_URL: "https://plesk-test.shalean.co.za"
          SHALEAN_APP_ENV: "preview"
          SHALEAN_ENFORCE_ENV_SAFETY: "true"
          OUTBOUND_MESSAGING_DISABLED: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://jhubpsbwmjgydkzztxeu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_IlDDZwioRpJRr2F6-B8WFA_uBrbZnkT"
          FACEBOOK_APP_ID: "ci-test-app-id"
          FACEBOOK_APP_SECRET: "ci-meta-data-deletion-test-secret"
        run: |
          set -euo pipefail
          nohup node server.js > /tmp/plesk-release-standalone.log 2>&1 &
          echo $! > /tmp/plesk-release-standalone.pid

          cleanup() {
            if [ -f /tmp/plesk-release-standalone.pid ]; then
              kill "$(cat /tmp/plesk-release-standalone.pid)" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:3000/api/health" >/tmp/plesk-release-health.json; then
              cat /tmp/plesk-release-health.json
              echo
              echo "Standalone release server ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done

          echo "Standalone release server failed to become ready."
          cat /tmp/plesk-release-standalone.log || true
          exit 1

      - name: Create Plesk release standalone bundle
        run: |
          set -euo pipefail
          rm -rf artifact-stage
          mkdir -p artifact-stage

          cp -a apps/web/.next/standalone artifact-stage/runtime

          cat > artifact-stage/build-meta.json <<META
          {
            "repository": "${GITHUB_REPOSITORY}",
            "source_release_ref": "integration/shalean-release",
            "source_release_sha": "f5dd54548ac4b1c50c7ce0cde744b05c4d8913e9",
            "uat_branch": "${GITHUB_REF_NAME}",
            "artifact_sha": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "npm": "$(npm --version)",
            "target": "plesk-test.shalean.co.za",
            "runtime_entry": "runtime/apps/web/server.js",
            "document_root": "runtime/apps/web/public",
            "environment": "preview/test",
            "deployment": "none"
          }
          META

          tar -czf "plesk-release-${GITHUB_SHA}.tar.gz" -C artifact-stage .

      - name: Upload release standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: plesk-release-${{ github.sha }}
          path: plesk-release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7
