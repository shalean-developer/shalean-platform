name: One-time Owner dashboard copy fix

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  apply-copy-fix:
    if: ${{ !contains(github.event.head_commit.message, '[owner-copy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Apply copy and period labels
        run: |
          python - <<'PY'
          from pathlib import Path

          my_work = Path('apps/web/src/features/office/OfficeMyWorkPanel.tsx')
          text = my_work.read_text()
          old = 'Show {Math.min(PAGE_SIZE, items.length - visibleCount)} more'
          new = 'Load {Math.min(PAGE_SIZE, items.length - visibleCount)} more'
          if old not in text:
              raise SystemExit('Expected My Work button text not found')
          my_work.write_text(text.replace(old, new, 1))

          dashboard = Path('apps/web/src/features/office/OfficeRoleDashboard.tsx')
          text = dashboard.read_text()
          replacements = {
              '<SummaryPanel title="Customers" href="/office/customers">': '<SummaryPanel title="Customers · Current window" href="/office/customers">',
              '<SummaryPanel title="Workforce" href="/office/cleaners">': '<SummaryPanel title="Workforce · Today" href="/office/cleaners">',
              '<SummaryPanel title="Booking services" href="/office/analytics">': '<SummaryPanel title="Booking services · Current window" href="/office/analytics">',
              '<SummaryPanel title="Financial" href="/office/financial-dashboard">': '<SummaryPanel title="Financial · This month" href="/office/financial-dashboard">',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected dashboard text not found: {old}')
              text = text.replace(old, new, 1)
          dashboard.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/office/OfficeMyWorkPanel.tsx apps/web/src/features/office/OfficeRoleDashboard.tsx
          git commit -m "fix(office): clarify queue action and summary periods [owner-copy-fix]"
          git push origin staging
