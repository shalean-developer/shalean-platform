name: cleaner-mobile-checks

on:
  push:
    branches:
      - feature/cleaner-mobile-e2e-20261110
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'packages/mobile-ui/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'packages/validation/**'
      - '.github/workflows/cleaner-mobile-checks.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/api-client/**'
      - 'packages/mobile-ui/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      - 'packages/validation/**'
      - '.github/workflows/cleaner-mobile-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleaner-mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install cleaner app dependencies
        run: npm ci
      - name: Typecheck cleaner mobile app
        run: npm run typecheck
      - name: Lint cleaner mobile app
        run: npm run lint
