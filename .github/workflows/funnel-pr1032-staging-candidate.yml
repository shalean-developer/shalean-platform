name: Funnel PR isolated staging candidate (no activation)

on:
  push:
    branches:
      - fix/funnel-intelligence-integrity-20261102
  workflow_dispatch:
    inputs:
      activate_staging:
        description: "Type ACTIVATE-PR1032-STAGING to allow staging activation"
        required: true
        type: string
      expected_sha:
        description: "Full exact commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHALEAN_APP_ENV: staging
      SHALEAN_ENFORCE_ENV_SAFETY: "true"
      SHALEAN_EXPECTED_SUPABASE_REF: uwvnmluiqbczeduzjgse
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://pricing-test.shalean.co.za
      NEXT_PUBLIC_APP_URL: https://pricing-test.shalean.co.za
      NEXT_PUBLIC_SUPABASE_URL: https://uwvnmluiqbczeduzjgse.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ vars.PLESK_STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Jl3ESJbVyt2gnuiVslYvHg_gy-LaG_1' }}"
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ vars.PLESK_TEST_PAYSTACK_PUBLIC_KEY }}
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert environment and source isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/funnel-intelligence-integrity-20261102"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SHALEAN_APP_ENV" = staging
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://uwvnmluiqbczeduzjgse.supabase.co"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY"
          case "$NEXT_PUBLIC_SUPABASE_ANON_KEY" in sb_publishable_*|eyJ*) ;; *) exit 1 ;; esac
          case "$NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY" in pk_test_*) ;; *) exit 1 ;; esac
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        working-directory: apps/web
        run: npm ci
      - name: Targeted funnel regression
        working-directory: apps/web
        run: npx vitest run lib/admin/__tests__/officeFunnelPresentation.test.ts
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build prebuilt Next.js staging candidate
        working-directory: apps/web
        env:
          FACEBOOK_APP_ID: build-only-placeholder
          FACEBOOK_APP_SECRET: build-only-placeholder
        run: |
          node --max-old-space-size=8192 ./node_modules/next/dist/bin/next build --webpack
          test -f .next/standalone/apps/web/server.js
      - name: Package without staging or production publication
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/funnel-pr1032"
          mkdir -p "$STAGE/.next"
          cp -a apps/web/.next/standalone/apps/web/. "$STAGE/"
          rm -rf "$STAGE/public" "$STAGE/.next/static"
          cp -a apps/web/public "$STAGE/public"
          cp -a apps/web/.next/static "$STAGE/.next/static"
          printf '{"artifact_sha":"%s","artifact_branch":"%s","deployment_environment":"staging","target_host":"pricing-test.shalean.co.za","supabase_ref":"uwvnmluiqbczeduzjgse","activated":false,"server_secrets_baked_in":false}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$STAGE/build-meta.json"
          mv "$STAGE/server.js" "$STAGE/server.next.js"
          cat > "$STAGE/server.js" <<'NODE'
          'use strict';
          process.env.SHALEAN_RELEASE_SHA = process.env.SHALEAN_RELEASE_SHA || require('./build-meta.json').artifact_sha;
          require('./server.next.js');
          NODE
          test -f "$STAGE/server.next.js"
          test -f "$STAGE/server.js"
          tar -czf "$RUNNER_TEMP/funnel-pr1032-staging-candidate.tar.gz" -C "$STAGE" .
          sha256sum "$RUNNER_TEMP/funnel-pr1032-staging-candidate.tar.gz" > "$RUNNER_TEMP/funnel-pr1032-staging-candidate.sha256"
      - name: Upload candidate for separately authorized staging activation
        uses: actions/upload-artifact@v4
        with:
          name: funnel-pr1032-staging-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/funnel-pr1032-staging-candidate.tar.gz
            ${{ runner.temp }}/funnel-pr1032-staging-candidate.sha256
          retention-days: 7
          if-no-files-found: error

  deploy-staging:
    name: Protected Plesk staging activation (manual only)
    needs: build-candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_staging == 'ACTIVATE-PR1032-STAGING' }}
    runs-on: ubuntu-latest
    environment: funnel-pr1032-staging
    permissions:
      contents: read
    steps:
      - name: Verify exact requested commit and staging-only destination
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_HOST: ${{ vars.FUNNEL_STAGING_SSH_HOST }}
          STAGING_USER: ${{ vars.FUNNEL_STAGING_SSH_USER }}
          STAGING_DIRECTORY: ${{ vars.FUNNEL_STAGING_DEPLOY_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/funnel-intelligence-integrity-20261102"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "${#EXPECTED_SHA}" -eq 40
          test "$STAGING_HOST" = "pricing-test.shalean.co.za"
          test -n "$STAGING_USER"
          test "$STAGING_DIRECTORY" = "/var/www/vhosts/shalean.co.za/funnel-pr1032-candidate"
      - name: Check out approved activation script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact artifact created by this run
        uses: actions/download-artifact@v4
        with:
          name: funnel-pr1032-staging-candidate-${{ github.sha }}
          path: candidate
      - name: Validate candidate archive and SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum -c funnel-pr1032-staging-candidate.sha256
          test "$(tar -xOf funnel-pr1032-staging-candidate.tar.gz ./build-meta.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifact_sha"])')" = "$EXPECTED_SHA"
          tar -tzf funnel-pr1032-staging-candidate.tar.gz | grep -Fx './server.next.js'
      - name: Transfer and activate on staging only, with existing rollback script
        env:
          SSH_KEY: ${{ secrets.FUNNEL_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FUNNEL_STAGING_SSH_KNOWN_HOSTS }}
          STAGING_HOST: ${{ vars.FUNNEL_STAGING_SSH_HOST }}
          STAGING_USER: ${{ vars.FUNNEL_STAGING_SSH_USER }}
          STAGING_DIRECTORY: ${{ vars.FUNNEL_STAGING_DEPLOY_DIRECTORY }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          SSH=(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$STAGING_USER@$STAGING_HOST" "test -d '$STAGING_DIRECTORY' && test ! -L '$STAGING_DIRECTORY'"
          "${SCP[@]}" candidate/funnel-pr1032-staging-candidate.tar.gz "$STAGING_USER@$STAGING_HOST:$STAGING_DIRECTORY/pricing-test-runtime.tar.gz"
          "${SCP[@]}" scripts/plesk-activate-prebuilt-pricing-test.sh "$STAGING_USER@$STAGING_HOST:$STAGING_DIRECTORY/activate.sh"
          "${SSH[@]}" "$STAGING_USER@$STAGING_HOST" "set -eu; cd '$STAGING_DIRECTORY'; test \"\$(tar -xOf pricing-test-runtime.tar.gz ./build-meta.json | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"artifact_sha\"])')\" = '$EXPECTED_SHA'; bash ./activate.sh"
      - name: Confirm staging release SHA and safe operating mode
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 https://pricing-test.shalean.co.za/api/health/environment |
            EXPECTED_SHA="$EXPECTED_SHA" python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert d.get("deployment")=="staging"; assert d.get("releaseSha")==os.environ["EXPECTED_SHA"]; assert (d.get("supabase") or {}).get("configuredRef")=="uwvnmluiqbczeduzjgse"; assert (d.get("paystack") or {}).get("secretMode")=="test"; assert (d.get("paystack") or {}).get("publicMode")=="test"; assert (d.get("messaging") or {}).get("outboundDisabled") is True; assert not d.get("issues")'
