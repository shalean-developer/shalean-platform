name: Temporary dependency lock refresh

on:
  push:
    branches:
      - fix/security-deps-20260930

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-deps-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Refresh patched dependency lock
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --save-exact \
            next@16.3.7 \
            axios@1.20.0 \
            @next/bundle-analyzer@16.3.7 \
            eslint-config-next@16.3.7
      - name: Commit refreshed manifest and lock
        run: |
          set -euo pipefail
          git config user.name "shalean-developer"
          git config user.email "developer@shalean.com"
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix(deps): patch Next.js and Axios security advisories"
          git push origin HEAD:fix/security-deps-20260930
