name: MASTER-00B security contract

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "apps/web/lib/security/__tests__/master00bBlogSearchPath.test.ts"
      - ".github/workflows/master-00b-security-contract.yml"

jobs:
  master-00b-security-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test -- lib/security/__tests__/master00bBlogSearchPath.test.ts
