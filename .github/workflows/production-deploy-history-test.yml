name: Production deploy history regression
on:
  pull_request:
    paths:
      - .github/workflows/prebuilt-plesk-production.yml
      - .github/workflows/production-deploy-history-test.yml
      - scripts/plesk-production-history.test.mjs
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/plesk-production-history.test.mjs
