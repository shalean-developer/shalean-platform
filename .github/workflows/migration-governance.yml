name: migration-governance

on:
  # Always run on PRs so required status check `validate-migration-filenames`
  # is reportable for every merge to main (path filters would stall required checks).
  pull_request:
  push:
    branches: [main]

jobs:
  validate-migration-filenames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate active Supabase migration filenames
        run: npm run db:migrations:validate
