name: web-test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Build/crawl the exact PR head (not the ephemeral merge ref).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect whether web / package paths changed
        id: filter
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "run_suite=true" >> "$GITHUB_OUTPUT"
              echo "No reliable push base; running full suite."
              exit 0
            fi
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD" || true)"
          echo "Changed paths:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Eq '^(apps/web/|packages/|\.github/workflows/web-test\.yml)'; then
            echo "run_suite=true" >> "$GITHUB_OUTPUT"
            echo "Web/package paths changed — running vitest suite."
          else
            echo "run_suite=false" >> "$GITHUB_OUTPUT"
            echo "No web/package path changes — reporting successful no-op for required vitest check."
          fi

      - name: Docs-only / unrelated change — required-check no-op
        if: steps.filter.outputs.run_suite != 'true'
        working-directory: .
        run: |
          echo "web-test: no-op success (documentation or unrelated paths only)."
          echo "Required check context 'vitest' reports terminal success without running expensive steps."

      - name: Confirm checkout SHA equals PR head
        if: github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        working-directory: .
        run: |
          set -euo pipefail
          GOT="$(git rev-parse HEAD)"
          WANT="${{ github.event.pull_request.head.sha }}"
          echo "checkout=$GOT"
          echo "pr_head=$WANT"
          test "$GOT" = "$WANT"

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.run_suite == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        if: steps.filter.outputs.run_suite == 'true'
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --package-lock=false @tailwindcss/postcss@^4
          node -e "require.resolve('@tailwindcss/postcss')"
          echo "Linked @shalean packages:"
          ls -la node_modules/@shalean
          test -f node_modules/@shalean/utils/package.json
          test -d ../../packages/utils/src

      - name: Production dependency audit (high+)
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run audit:production

      - name: Critical tests (payments + referrals)
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run test:critical

      - name: Mandatory privileged Office email verification security contract
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run test -- lib/security/__tests__/p0MandatoryAal2Contract.test.ts lib/security/__tests__/p0PrivilegedMfaRolloutContract.test.ts

      - name: Revenue path tests (booking, dispatch, cleaner API, cron locks, cost gates)
        if: steps.filter.outputs.run_suite == 'true'
        run: >-
          npm run test --
          lib/booking-v2/__tests__/serviceSuppliesPolicy.test.ts
          lib/booking-v2/__tests__/servicePricingSourceOfTruth.test.ts
          lib/booking-v2/__tests__/authoritativePricingCatalogRead.test.ts
          lib/booking-v2/__tests__/pricingAvailabilityState.test.ts
          lib/booking-v2/__tests__/authoritativePricingClientAvailability.test.ts
          lib/booking/__tests__/cleanerServicePreferenceEligibility.test.ts
          lib/dispatch/__tests__/h9DispatchEscalationStatusFilter.test.ts
          app/api/cleaner/__tests__/cleanerEarningsApi.test.ts
          app/api/cleaner/__tests__/cleanerJobsTeamApi.test.ts
          lib/cron/__tests__/h15CronLockOverlapPrevention.test.ts
          lib/cron/__tests__/cr05RetryFailedJobsCadence.test.ts
          lib/cron/__tests__/cr10VercelBuildGate.test.ts
          lib/admin/__tests__/cr11OfficeOpsQueryCost.test.ts
          lib/admin/__tests__/m13m14AdminEligibilityConvergence.test.ts

      - name: Focused marketing / Meta compliance unit tests
        if: steps.filter.outputs.run_suite == 'true'
        run: >-
          npm run test --
          lib/marketing/__tests__/marketingAreaLinks.test.ts
          lib/marketing/__tests__/globalTopNavVisibility.test.ts
          lib/marketing/__tests__/uiSystemRouteContract.test.ts
          lib/meta/__tests__/dataDeletion.test.ts
          lib/meta/__tests__/complianceRoutes.contract.test.ts
          lib/services/__tests__/publicServiceExtras.test.ts
          lib/services/__tests__/primaryServiceHeroContract.test.ts
          lib/services/__tests__/primaryServiceRouteContract.test.ts
          lib/seo/__tests__/capeTownServiceSchemaPricingAuthority.test.ts
          lib/seo/__tests__/pricingRouteAuthorityProxy.test.ts
          lib/seo/__tests__/locationsShortSlugProxyRedirect.test.ts
          app/api/meta/data-deletion/__tests__/route.test.ts
          lib/oauth/__tests__/metaFacebookOAuth.test.ts
          lib/promotions/providers/__tests__/registry.test.ts

      - name: Blog route governance
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run validate:blog-routes && npm run audit:internal-links && npm run validate:cms-blog-links

      - name: Typecheck
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run typecheck

      - name: Booking core ESLint gate
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run lint:booking-core

      - name: Blog SEO governance report
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run report:blog-seo-governance

      - name: Canonical purity report
        if: steps.filter.outputs.run_suite == 'true'
        run: npm run report:canonical-purity

      - name: Live SEO validation (production site health)
        if: steps.filter.outputs.run_suite == 'true'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL || 'https://shalean.co.za' }}
          LIVE_SEO_EXTENDED: ${{ vars.LIVE_SEO_EXTENDED || '1' }}
        run: npm run validate:live-seo

      - name: Search Console readiness (production site health)
        if: steps.filter.outputs.run_suite == 'true'
        env:
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL || 'https://shalean.co.za' }}
          REQUIRE_GSC_VERIFICATION: ${{ vars.REQUIRE_GSC_VERIFICATION || '0' }}
        run: npm run validate:search-console-readiness

      - name: Write CI build SHA for PR crawl proof
        if: github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        run: |
          set -euo pipefail
          echo -n "${{ github.event.pull_request.head.sha }}" > public/ci-build-sha.txt
          echo "Wrote public/ci-build-sha.txt=$(cat public/ci-build-sha.txt)"

      - name: Production Next.js build (PR crawl target)
        if: github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          FACEBOOK_APP_ID: ci-test-app-id
          FACEBOOK_APP_SECRET: ci-meta-data-deletion-test-secret
        run: node --max-old-space-size=8192 ./node_modules/next/dist/bin/next build --webpack

      - name: Start production Next.js server
        if: github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          FACEBOOK_APP_ID: ci-test-app-id
          FACEBOOK_APP_SECRET: ci-meta-data-deletion-test-secret
        run: |
          set -euo pipefail
          nohup npm run start -- -H 127.0.0.1 -p 3000 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:3000/api/health" >/dev/null; then
              echo "Server ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to become ready"
          cat /tmp/next-start.log || true
          exit 1

      - name: PR-build live internal link crawl
        if: github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          echo "Crawling proposed PR build (not production)"
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          npm run validate:live-internal-links

      - name: PR-build location + compliance route matrix
        if: github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        env:
          AUDIT_BASE_URL: http://127.0.0.1:3000
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha }}
          FACEBOOK_APP_SECRET: ci-meta-data-deletion-test-secret
        run: npm run validate:pr-build-routes

      - name: Stop production Next.js server
        if: always() && github.event_name == 'pull_request' && steps.filter.outputs.run_suite == 'true'
        run: |
          if [ -f /tmp/next.pid ]; then kill "$(cat /tmp/next.pid)" || true; fi
