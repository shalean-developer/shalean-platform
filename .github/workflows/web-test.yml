name: web-test

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-test.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-test.yml"

jobs:
  vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Production dependency audit (high+)
        run: npm run audit:production
      - name: Critical tests (payments + referrals)
        run: npm run test:critical
      - name: Revenue path tests (booking, dispatch, cleaner API, cron locks)
        run: >-
          npm run test --
          lib/booking/__tests__/cleanerServicePreferenceEligibility.test.ts
          lib/dispatch/__tests__/h9DispatchEscalationStatusFilter.test.ts
          app/api/cleaner/__tests__/cleanerEarningsApi.test.ts
          app/api/cleaner/__tests__/cleanerJobsTeamApi.test.ts
          lib/cron/__tests__/h15CronLockOverlapPrevention.test.ts
          lib/admin/__tests__/m13m14AdminEligibilityConvergence.test.ts
      - name: Blog route governance
        run: npm run validate:blog-routes && npm run audit:internal-links && npm run validate:cms-blog-links
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Booking core ESLint gate
        run: npm run lint:booking-core
      - name: Blog SEO governance report
        run: npm run report:blog-seo-governance
      - name: Canonical purity report
        run: npm run report:canonical-purity
      - name: Live SEO validation (optional)
        if: ${{ vars.AUDIT_BASE_URL != '' }}
        env:
          AUDIT_BASE_URL: ${{ vars.AUDIT_BASE_URL }}
          LIVE_SEO_EXTENDED: ${{ vars.LIVE_SEO_EXTENDED }}
        run: npm run validate:live-seo
