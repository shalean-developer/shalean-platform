name: Plesk pricing-test standalone artifact

on:
  push:
    branches:
      - integration/shalean-release
    paths:
      - ".github/workflows/plesk-pricing-test.yml"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plesk-pricing-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build isolated pricing-test runtime
    runs-on: ubuntu-latest
    environment:
      name: pricing-test
      url: https://pricing-test.shalean.co.za
    timeout-minutes: 45
    env:
      SHALEAN_APP_ENV: "test"
      SHALEAN_ENFORCE_ENV_SAFETY: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: "https://pricing-test.shalean.co.za"
      NEXT_PUBLIC_APP_URL: "https://pricing-test.shalean.co.za"
      NEXT_PUBLIC_SUPABASE_URL: "https://jhubpsbwmjgydkzztxeu.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${{ secrets.PLESK_TEST_SUPABASE_PUBLISHABLE_KEY }}"
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: "${{ secrets.PLESK_TEST_PAYSTACK_PUBLIC_KEY }}"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Guard exact test branch and public configuration
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            integration/shalean-release|feat/plesk-pricing-test-auto-deploy|fix/booking-v2-six-service-pricing-convergence) ;;
            *) echo "::error::Unexpected pricing-test artifact branch: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          test "${NEXT_PUBLIC_SUPABASE_URL}" = "https://jhubpsbwmjgydkzztxeu.supabase.co"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          case "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" in sb_publishable_*|eyJ*) ;; *) exit 1;; esac
          case "${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}" in pk_test_*) ;; *) echo "::error::Test Paystack key must start pk_test_"; exit 1;; esac
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm install --no-save --package-lock=false --package-lock-only=false --ignore-scripts @tailwindcss/postcss@4.1.14
      - name: Build standalone
        working-directory: apps/web
        env:
          FACEBOOK_APP_ID: "build-only-placeholder"
          FACEBOOK_APP_SECRET: "build-only-placeholder"
        run: |
          node --max-old-space-size=8192 ./node_modules/next/dist/bin/next build --webpack
          test -f .next/standalone/apps/web/server.js
      - name: Add public and static assets
        working-directory: apps/web
        run: |
          RUNTIME=".next/standalone/apps/web"
          rm -rf "$RUNTIME/public" "$RUNTIME/.next/static"
          mkdir -p "$RUNTIME/.next"
          cp -a public "$RUNTIME/public"
          cp -a .next/static "$RUNTIME/.next/static"
      - name: Smoke standalone runtime
        working-directory: apps/web/.next/standalone/apps/web
        env:
          HOSTNAME: "127.0.0.1"
          PORT: "3000"
          FACEBOOK_APP_ID: "build-only-placeholder"
          FACEBOOK_APP_SECRET: "build-only-placeholder"
        run: |
          set -euo pipefail
          nohup node server.js >/tmp/pricing-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/pricing-test.log || true
          exit 1
      - name: Package artifact
        run: |
          mkdir -p artifact-stage
          cp -a apps/web/.next/standalone artifact-stage/runtime
          cat > artifact-stage/build-meta.json <<META
          {"artifact_sha":"${GITHUB_SHA}","target_host":"pricing-test.shalean.co.za","deployment_environment":"test","supabase_ref":"jhubpsbwmjgydkzztxeu","runtime_entry":"runtime/apps/web/server.js","document_root":"runtime/apps/web/public","deployment_performed":false}
          META
          tar -czf "plesk-pricing-test-${GITHUB_SHA}.tar.gz" -C artifact-stage .
      - uses: actions/upload-artifact@v4
        with:
          name: plesk-pricing-test-${{ github.sha }}
          path: plesk-pricing-test-${{ github.sha }}.tar.gz
          retention-days: 7

      - name: Publish immutable pricing-test artifact to private release storage
        env:
          SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.PLESK_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLESK_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ vars.PLESK_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BUCKET"
          OBJECT="pricing-test/plesk-pricing-test-$SHA.tar.gz"
          HTTP="$(curl -sS -o upload-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$OBJECT" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: false" \
            --data-binary @"plesk-pricing-test-$SHA.tar.gz")"
          if [ "$HTTP" != 200 ] && [ "$HTTP" != 201 ]; then
            # Immutable object may already exist on a workflow rerun. Verify
            # existence instead of overwriting it.
            curl -fsS \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              "$SUPABASE_URL/storage/v1/object/info/$BUCKET/$OBJECT" >/dev/null
          fi

      - name: Create guarded pricing-test pull bundle
        env:
          SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.PLESK_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLESK_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ vars.PLESK_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          OBJECT="pricing-test/plesk-pricing-test-$SHA.tar.gz"
          RESPONSE="$(curl -fsS \
            -X POST "$SUPABASE_URL/storage/v1/object/sign/$BUCKET/$OBJECT" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"expiresIn":3600}')"
          SIGNED="$(jq -r '.signedURL // .signedUrl // empty' <<<"$RESPONSE")"
          test -n "$SIGNED"
          case "$SIGNED" in
            http://*|https://*) URL="$SIGNED" ;;
            *) URL="${SUPABASE_URL%/}/storage/v1$SIGNED" ;;
          esac
          echo "::add-mask::$URL"
          mkdir -p pricing-test-pull
          printf '%s' "$URL" > pricing-test-pull/url.txt
          sha256sum "plesk-pricing-test-$SHA.tar.gz" > pricing-test-pull/release.sha256
          cp artifact-stage/build-meta.json pricing-test-pull/build-meta.json

      - name: Publish guarded pull metadata to private release storage
        env:
          SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.PLESK_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLESK_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ vars.PLESK_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          PREFIX="pricing-test/pull/$SHA"
          for FILE in url.txt release.sha256 build-meta.json; do
            MIME="text/plain"
            [ "$FILE" = "build-meta.json" ] && MIME="application/json"
            HTTP="$(curl -sS -o "metadata-$FILE-response.json" -w '%{http_code}' \
              -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$PREFIX/$FILE" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: $MIME" \
              -H "x-upsert: true" \
              --data-binary @"pricing-test-pull/$FILE")"
            test "$HTTP" = 200 || test "$HTTP" = 201 || {
              cat "metadata-$FILE-response.json"
              exit 1
            }
          done
          printf '%s' "$SHA" > current.txt
          HTTP="$(curl -sS -o metadata-current-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/pricing-test/pull/current.txt" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: text/plain" \
            -H "x-upsert: true" \
            --data-binary @current.txt)"
          test "$HTTP" = 200 || test "$HTTP" = 201

      - name: Publish short-lived pricing-test bootstrap manifest
        env:
          SHA: ${{ github.sha }}
          SUPABASE_URL: ${{ secrets.PLESK_RELEASE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLESK_RELEASE_SUPABASE_SERVICE_ROLE_KEY }}
          BUCKET: ${{ vars.PLESK_RELEASE_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p bootstrap
          printf '{"release_sha":"%s","expires_in":3600,"files":{' "$SHA" > bootstrap/bootstrap.json
          FIRST=true
          for FILE in url.txt release.sha256 build-meta.json; do
            RESPONSE="$(curl -fsS \
              -X POST "$SUPABASE_URL/storage/v1/object/sign/$BUCKET/pricing-test/pull/$SHA/$FILE" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              --data '{"expiresIn":3600}')"
            SIGNED="$(jq -r '.signedURL // .signedUrl // empty' <<<"$RESPONSE")"
            test -n "$SIGNED"
            case "$SIGNED" in
              http://*|https://*) URL="$SIGNED" ;;
              *) URL="${SUPABASE_URL%/}/storage/v1$SIGNED" ;;
            esac
            echo "::add-mask::$URL"
            [ "$FIRST" = true ] || printf ',' >> bootstrap/bootstrap.json
            FIRST=false
            printf '"%s":%s' "$FILE" "$(jq -Rn --arg v "$URL" '$v')" >> bootstrap/bootstrap.json
          done
          printf '}}' >> bootstrap/bootstrap.json
          jq -e --arg sha "$SHA" '.release_sha == $sha and (.files | length) == 3' bootstrap/bootstrap.json >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: plesk-pricing-test-pull-${{ github.sha }}
          path: pricing-test-pull/
          if-no-files-found: error
          retention-days: 1
